<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ESH Explorer - pkg/data/data/com.termux/files/usr/etc/esh</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; padding: 40px; }
        .box { max-width: 850px; margin: auto; background: #161b22; border: 1px solid #30363d; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .header { padding: 15px 20px; background: #21262d; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        .list { padding: 10px 0; }
        .item { display: flex; align-items: center; padding: 12px 20px; text-decoration: none; color: #58a6ff; border-bottom: 1px solid #21262d; transition: 0.2s; }
        .item:hover { background: #1f242c; padding-left: 25px; }
        .item:last-child { border: none; }
        .footer { padding: 10px; text-align: center; font-size: 12px; color: #8b949e; }
    </style>
</head>
<body>
    <div class="box">
        <div class="header">
            <span><strong>Directory:</strong> /pkg/data/data/com.termux/files/usr/etc/esh</span>
            <a href="../index.html" style="color: #8b949e; text-decoration: none;">↑ Up</a>
        </div>
        <div id="explorer" class="list"></div>
        <div class="footer">ESH Project v3.1.0 - Generated by Professional</div>
    </div>
    <script>
        const files = ['esh.conf',];
        const container = document.getElementById('explorer');
        files.forEach(f => {
            if(!f) return;
            const a = document.createElement('a');
            a.href = f;
            a.className = 'item';
            a.innerText = f.endsWith('/') ? "📁 " + f : "📄 " + f;
            container.appendChild(a);
        });
    </script>
</body>
</html>
