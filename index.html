<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ESH Explorer - Root</title>
    <style>
        body { font-family: sans-serif; background: #0d1117; color: #c9d1d9; padding: 40px; }
        .box { max-width: 800px; margin: auto; background: #161b22; border: 1px solid #30363d; border-radius: 6px; overflow: hidden; }
        .header { padding: 15px; background: #21262d; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; }
        .item { display: block; padding: 12px; border-bottom: 1px solid #21262d; text-decoration: none; color: #58a6ff; }
        .item:hover { background: #1f242c; }
        .item:last-child { border: none; }
    </style>
</head>
<body>
    <div class="box">
        <div class="header">
            <span>📂 Path: Root</span>
            <a href="https://github.com/adembenarfa175-code/esh_project_Shell" style="color: #8b949e; text-decoration: none;">↑ Back</a>
        </div>
        <div id="list"></div>
    </div>
    <script>
        const files = ['Esh-framework-Lite/',
'Esh-of-theme/',
'LICENSE',
'README.md',
'build_global_repo.sh',
'deploy_to_github.sh',
'esh-repo/',
'esh_1.0.0_aarch64.deb',
'esh_1.1.0_aarch64.deb',
'esh_1.2.0_aarch64.deb',
'esh_1.2.1_aarch64.deb',
'esh_2.0.0_aarch64.deb',
'esh_2.1.0_aarch64.deb',
'esh_2.1.1_aarch64.deb',
'esh_2.2.0_aarch64.deb',
'esh_2.3.0_aarch64.deb',
'esh_3.0.0_aarch64.deb',
'esh_3.1.0_aarch64.deb',
'fix_and_add_heredoc.sh',
'generate_web_explorer.sh',
'inject_lolcat_banner.sh',
'inject_multiarch.sh',
'oh-my-esh/',
'pkg/',
'release_v310.sh',
'src/',
'sync_web_explorer.sh',
'upgrade_to_pro_zsh_style.sh',
'versions_factory/',];
        const container = document.getElementById('list');
        files.forEach(f => {
            if(!f) return;
            const a = document.createElement('a');
            a.href = f;
            a.className = 'item';
            a.innerText = f.endsWith('/') ? "📁 " + f : "📄 " + f;
            container.appendChild(a);
        });
    </script>
</body>
</html>
